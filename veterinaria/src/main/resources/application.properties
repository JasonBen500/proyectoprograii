spring.application.name=veterinaria
spring.config.import=optional:classpath:application-local.properties

# Base de datos (valores por variable de entorno o en application-local.properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: el secreto es obligatorio (minimo 32 caracteres). NO lo escribas aqui.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Perfil con permisos de administrador y origen del frontend
app.perfil-admin=${APP_PERFIL_ADMIN:Administrador}
app.cors.origen=${APP_CORS_ORIGEN:http://localhost:5173}

